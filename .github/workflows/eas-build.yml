name: EAS APK Build — Plaasboek™

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  eas-build:
    name: Build APK — Plaasboek™
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react_native_space/package-lock.json

      - name: Install dependencies
        working-directory: react_native_space
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: react_native_space
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'production' }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Notify Slack — Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'vcds-ops'
          slack-message: |
            ✅ *Plaasboek™ APK Build QUEUED on EAS*
            Profile: `${{ github.event.inputs.profile || 'production' }}`
            Triggered by: ${{ github.actor }}
            <https://expo.dev/accounts/valhalla-custom-design-studios/builds|View on EAS>
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Notify Slack — Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'vcds-ops'
          slack-message: |
            🔴 *Plaasboek™ APK Build FAILED*
            Actor: ${{ github.actor }}
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
